services:
  - type: web
    name: axitraders
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && npm run build:server
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: LOCAL_AUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: Kaspertrading9@gmail.com
